<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>aash muutai yumnud  </title>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#28283b;background:#f9eff8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#ffd8e8,transparent 50%),radial-gradient(circle at 0 90%,#dce8ff,transparent 55%),#f9eff8}.wrap{max-width:650px;margin:auto;padding:22px 16px 60px}.hero{text-align:center;padding:20px 0}.hero h1{font-size:clamp(28px,7vw,43px);margin:5px 0;font-weight:900;letter-spacing:-1.5px}.hero p{margin:5px 0;color:#736a80}.meme{font-size:38px;letter-spacing:7px}.card{background:#fff;border:2px solid #f2e8f3;border-radius:24px;padding:24px;box-shadow:0 15px 40px #9a7a9b22}.progress{height:8px;background:#f2edf3;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ed82b3,#9e91e7);transition:width .25s}.meta{font-size:12px;color:#927b9e;font-weight:800;margin-top:15px}h2{font-size:23px;margin:12px 0 8px}.hint{color:#8a8191;font-size:14px;margin:0 0 19px}.choices{display:grid;gap:10px}.choice{display:flex;align-items:center;gap:12px;border:2px solid #eee9f0;border-radius:15px;padding:15px;cursor:pointer;line-height:1.4}.choice:has(input:checked){background:#fff1f8;border-color:#e58ab6}.choice input{accent-color:#d56da4;width:18px;height:18px;flex-shrink:0}.name{width:100%;border:2px solid #eee9f0;border-radius:15px;padding:15px;font:inherit}.nav{display:flex;gap:10px;margin-top:24px}button{font:inherit;font-weight:800;border:0;border-radius:13px;padding:13px 18px;cursor:pointer}.primary{background:#35314c;color:white;flex:1}.secondary{background:#f3eff5;color:#534a60}.primary:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none}.summary{background:#faf7fc;border-radius:16px;padding:15px;white-space:pre-wrap;line-height:1.6;font-size:14px;overflow-wrap:anywhere}.idea{padding:16px;border-radius:17px;background:#f6f0ff;margin:12px 0}.idea h3{margin:0 0 7px}.idea p{margin:0;color:#645d72;line-height:1.5}.foot{text-align:center;color:#9c91a0;font-size:12px;margin-top:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.actions button{flex:1;min-width:130px}.small{font-size:12px;color:#8a8191;line-height:1.5}.group{margin-top:15px;padding-top:15px;border-top:1px solid #eee}a{color:#7c5cba}
</style>
</head><body><div class="wrap"><header class="hero"><div class="meme">  🧳</div><h1>aash muutai yumnud</h1><p>2026 ondoo bagtaad hil dawna gedegt itgej naidaj bnaaa 🤞😭</p></header>
<main id="quiz" class="card"><div class="progress"><div class="fill" id="fill"></div></div><div class="meta" id="meta"></div><h2 id="question"></h2><p class="hint" id="hint"></p><div class="choices" id="choices"></div><div class="nav"><button class="secondary" id="back">← back</button><button class="primary" id="next">next →</button></div></main>
<section id="result" class="card hidden"><h2 id="resultTitle">sending...  </h2><p id="status" aria-live="polite">saving your picks...</p><div id="savedContent" class="hidden"><h3>your picks 📝</h3><div class="summary" id="summary"></div><h3>trip ideas 👀</h3><div id="ideas"></div><p class="small">These are ideas, not verified prices or bookings. Squad match will be decided after all 3 submit.</p></div><div class="actions"><button class="primary hidden" id="retry">retry save ↻</button><button class="secondary hidden" id="restart">start over ↻</button></div></section><div class="foot"><a href="results.html" style="display:inline-block;margin:8px;padding:12px 18px;background:#fff;border-radius:14px;font-weight:800;text-decoration:none">📊 See squad results →</a><p>aash muutai yumnud  </p></div></div>
<script>
const questions=[
{key:'name',title:'who dis? 👀',hint:'nickname байхад болно',type:'text'},
{key:'passport',title:'🛂 passport belen uu?',options:['yes, ready','zahialsan, udahgui','odoohondoo bhgui','hugatsaag ni shalgana']},
{key:'vibe',title:'what’s the vibe? 🌴',options:['beach + chill 🏖️','city + shopping 🛍️','christmas vibes 🎄','a little bit of everything ✨']},
{key:'weather',title:'weather check ☀️',options:['hot hot hot','duulaahan','seruuhen ch okay']},
{key:'activities',title:'what are we doing? 📸',hint:'pick up to 3',multi:true,options:['beach / swimming','cute pics','shopping','food hunting','fun parks / sightseeing','christmas lights']},
{key:'budget',title:'budget reality check 💸',options:['1.5M ₮','1.8M ₮','2M ₮','2M+ ₮']},
{key:'transport',title:'how to get there? 🚆',options:['ground + flight, save money','flight preferred, save time']},
{key:'days',title:'hed honog yavbal zgr ve? 🗓️',options:['3 honog','4 honog','5 honog','6 honog','7 honog']},
{key:'date',title:'when tho? 📅',options:['11.26–12.04','12 sariin dunduur','12.19-s hoish']}
];
const SUPABASE_URL='https://vyrcazizxsfctlcvtctk.supabase.co';
const SUPABASE_KEY='sb_publishable_RMSAqWDn8XVjbR0Ds7ZWOg_V78hHop7';
const $=id=>document.getElementById(id);let step=0,answers={},pending=null,sending=false;
function valid(){const q=questions[step],a=answers[q.key];$('next').disabled=q.multi?!Array.isArray(a)||a.length===0:!a||!String(a).trim()}
function render(){const q=questions[step];$('fill').style.width=((step+1)/questions.length*100)+'%';$('meta').textContent=`${step+1} / ${questions.length}`;$('question').textContent=q.title;$('hint').textContent=q.hint||'pick one';$('choices').replaceChildren();if(q.type==='text'){const input=document.createElement('input');input.className='name';input.placeholder='name / nickname';input.maxLength=35;input.value=answers[q.key]||'';input.oninput=()=>{answers[q.key]=input.value.trim();valid()};$('choices').append(input)}else q.options.forEach(option=>{const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type=q.multi?'checkbox':'radio';input.name=q.key;input.checked=q.multi?(answers[q.key]||[]).includes(option):answers[q.key]===option;input.onchange=()=>{if(q.multi){const a=answers[q.key]||[];if(input.checked&&a.length>=3){input.checked=false;return}answers[q.key]=input.checked?[...a,option]:a.filter(x=>x!==option)}else answers[q.key]=option;valid()};label.append(input,document.createTextNode(option));$('choices').append(label)});$('back').style.visibility=step?'visible':'hidden';$('next').textContent=step===questions.length-1?'done →':'next →';valid()}
$('back').onclick=()=>{step--;render()};$('next').onclick=()=>{if(step<questions.length-1){step++;render()}else finish()};
function ideas(a){
 const acts=a.activities||[];
 const beach=a.vibe?.includes('beach')||acts.some(x=>x.includes('beach'));
 const city=a.vibe?.includes('city')||acts.includes('shopping')||acts.includes('food hunting');
 const christmas=a.vibe?.includes('christmas')||acts.includes('christmas lights');
 const coldOkay=a.weather==='seruuhen ch okay';
 const budget=a.budget||'';
 const lowerBudget=budget==='1.5M ₮';
 const result=[];
 if(city||coldOkay||lowerBudget)result.push(['Hohhot / Хөх хот 🛍️','Shopping, food, short city trip. Өвөл хүйтэн; хил, тээвэр, нийт зардлаа шалгана.']);
 if(city||christmas||coldOkay)result.push(['Beijing / Бээжин 🏯','Sightseeing, food, shopping, winter city vibes. Өвөл хүйтэн; маршрут болон зардлыг шалгана.']);
 if(beach||a.weather==='hot hot hot')result.push(['Sanya / Санья 🏖️','Warm beach option. Flight, hotel, transport нийлээд төсөвт багтах эсэхийг шалгана.']);
 if(christmas&&!lowerBudget)result.push(['Hong Kong 🎄','Christmas lights + city vibes. Нийт зардал өндөр байж магадгүй.']);
 if(!result.length)result.push(['Hohhot or Beijing  ','Short city trip хийх боломжит хувилбарууд.']);
 return result.slice(0,3)
}
function format(a){return questions.map(q=>q.title+'\n'+(Array.isArray(a[q.key])?a[q.key].join(', '):a[q.key]||'-')).join('\n\n')}
async function finish(){
  if(sending)return;
  pending=JSON.parse(JSON.stringify(answers));
  $('quiz').classList.add('hidden');$('result').classList.remove('hidden');
  $('savedContent').classList.add('hidden');$('retry').classList.add('hidden');
  $('restart').classList.add('hidden');
  window.scrollTo(0,0);
  await submit();
}
async function submit(){
  if(sending||!pending)return;
  sending=true;$('resultTitle').textContent='sending...  ';
  $('status').textContent='saving your picks...';$('retry').classList.add('hidden');
  try{
    const {name,...other}=pending;
    const response=await fetch(SUPABASE_URL+'/rest/v1/trip_responses',{
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({nickname:name,answers:other})
    });
    if(!response.ok)throw new Error('HTTP '+response.status+': '+(await response.text()).slice(0,250));
    $('resultTitle').textContent='doneee 💅';
    $('status').textContent='saved! '+name+' ✨';
    $('summary').textContent=format(pending);
    $('ideas').replaceChildren();
    ideas(pending).forEach(([title,desc])=>{
      const div=document.createElement('div');div.className='idea';
      const h=document.createElement('h3');h.textContent=title;
      const p=document.createElement('p');p.textContent=desc;
      div.append(h,p);$('ideas').append(div);
    });
    $('savedContent').classList.remove('hidden');
    $('restart').classList.remove('hidden');
    pending=null;
  }catch(err){
    $('resultTitle').textContent='not saved yet 🥲';
    $('status').textContent='Could not save. Check internet / Supabase policy and retry. '+err.message;
    $('retry').classList.remove('hidden');
    $('restart').classList.remove('hidden');
  }finally{sending=false}
}
$('retry').onclick=submit;
$('restart').onclick=()=>{step=0;answers={};pending=null;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render();window.scrollTo(0,0)};
render();
</script></body></html>
